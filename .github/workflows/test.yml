name: test

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-action:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run octofetch
        uses: ./
        with:
          GITHUB_TOKEN: ${{ secrets.OCTOFETCH_ }}
          CONFIG_FILE: .github/default.config.json
          OUTPUT_FILE: ./data/sourced.json

      - name: Verify artifacts
        run: |
          if [ ! -s "./data/sourced.json" ]; then
            echo "::error:: Output file is missing or empty."
            exit 1
          fi
          echo "Payload captured successfully."