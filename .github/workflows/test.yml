name: test

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-action:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run octofetch action
        uses: ./
        with:
          query_file: ".github/octofetch/repo-meta.gql"
          variables: '{"owner": "${{ github.repository_owner }}", "name": "${{ github.event.repository.name }}"}'
          output_file: ./data/sourced.json

      - name: Verify artifacts
        run: |
          if [ ! -s "./data/sourced.json" ]; then
            echo "::error:: Output file is missing or empty."
            exit 1
          fi
          echo "Payload captured successfully."