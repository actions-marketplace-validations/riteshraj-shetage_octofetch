name: Test Octofetch Action

on:
  workflow_dispatch: 

jobs:
  test-action:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Action
        uses: ./
        with:
          github_token: ${{ secrets.OCTOFETCH_TOKEN }}
          config_file: ./config/octofetch.config.json
